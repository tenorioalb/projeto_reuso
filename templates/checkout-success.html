<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado</title>
    
    <!-- CSS Estático Vinculado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout-success.css') }}">

    <!-- JavaScript Estático Vinculado -->
    <script src="{{ url_for('static', filename='js/checkout-success.js') }}"></script>
</head>
<body>

    <div class="card-sucesso">
        <div class="icone-check">&check;</div>
        <h1>Sucesso!</h1>
        <p>{{ mensagem_sucesso }}</p>
        
        <div class="timer-box">
            Você será redirecionado para a loja em <strong id="contador">4</strong> segundos...
        </div>

        <!-- Guardamos a URL gerada pelo Flask em um input oculto para o JS externo ler -->
        <input type="hidden" id="url_destino" value="{{ url_destino }}">
    </div>
</body>
</html>
