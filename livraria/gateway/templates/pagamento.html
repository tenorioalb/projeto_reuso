<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra Confirmada | Livraria Didática</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">📚 Livraria Didática</span>
    </div>
  </nav>

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh">
    <div class="card text-center shadow p-4 border-success" style="max-width: 420px; width: 100%">
      <div class="card-body">
        <div class="display-1 text-success mb-2">&#10003;</div>
        <h4 class="card-title">Compra Realizada!</h4>
        <p class="card-text text-muted mt-2">{{ mensagem }}</p>
        <hr>
        <p class="fw-bold fs-5 text-success">R$ {{ "%.2f"|format(total) }}</p>
        <a href="/" class="btn btn-outline-success mt-2">Voltar à livraria</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
